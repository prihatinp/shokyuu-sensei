<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shokyuu Sensei</title>
<meta name="description" content="Guru bahasa Jepang untuk buku 初級日本語">
<meta name="theme-color" content="#2B4470">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Navigasi utama">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">初</span>
      <span class="brand-name">Shokyuu<br>Sensei</span>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/materi" data-tab="materi"><span class="tab-ico" aria-hidden="true">本</span><span>Materi</span></a>
      <a href="#/kartu" data-tab="kartu"><span class="tab-ico" aria-hidden="true">札</span><span>Kartu</span></a>
      <a href="#/kuis" data-tab="kuis"><span class="tab-ico" aria-hidden="true">問</span><span>Kuis</span></a>
      <a href="#/sensei" data-tab="sensei"><span class="tab-ico" aria-hidden="true">話</span><span>Sensei</span></a>
      <a href="#/progres" data-tab="progres"><span class="tab-ico" aria-hidden="true">歩</span><span>Progres</span></a>
    </nav>
    <a class="rail-setting" href="#/setting" data-tab="setting" aria-label="Pengaturan">設定</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <label class="bab-pick">
        <span class="sr">Bab aktif</span>
        <select id="babSelect" aria-label="Bab aktif"></select>
      </label>
      <span class="net" id="netStatus" role="status"></span>
      <a class="top-setting" href="#/setting" aria-label="Pengaturan">設定</a>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/speech.js"></script>
<script src="js/sensei.js"></script>
<script src="js/app.js"></script>
</body>
</html>
